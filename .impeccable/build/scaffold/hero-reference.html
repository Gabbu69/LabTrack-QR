<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b-tool-crib-counter.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <div class="r-sidebar-brand region text" data-region="sidebar-brand"><!-- LabTrack QR brand lockup --><p style="font-size:var(--r-sidebar-brand-font);line-height:1.05;margin:0">sidebar-brand</p></div>
  <div class="r-sidebar-navigation region control" data-region="sidebar-navigation"><!-- navy navigation rail with icon and text links: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-demo-banner region text" data-region="demo-banner"><!-- persistent yellow demo warning --><p style="font-size:var(--r-demo-banner-font);line-height:1.05;margin:0">demo-banner</p></div>
  <div class="r-utility-status region text" data-region="utility-status"><!-- time, date, role, and user --><p style="font-size:var(--r-utility-status-font);line-height:1.05;margin:0">utility-status</p></div>
  <div class="r-page-title region text" data-region="page-title"><!-- Tool-Crib Checkout Counter display heading --><p style="font-size:var(--r-page-title-font);font-family:var(--r-page-title-family),sans-serif;font-weight:var(--r-page-title-weight);line-height:1.05;margin:0">page-title</p></div>
  <div class="r-page-greeting region text" data-region="page-greeting"><!-- short welcome line --><p style="font-size:var(--r-page-greeting-font);line-height:1.05;margin:0">page-greeting</p></div>
  <div class="r-scan-prompt region control" data-region="scan-prompt"><!-- compact QR scanner shortcut: rebuild the control's chrome from the crop (comp-spec.mjs --crop scan-prompt); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-metric-total region text" data-region="metric-total"><!-- Total Tools label and value --><p style="font-size:var(--r-metric-total-font);line-height:1.05;margin:0">metric-total</p></div>
  <div class="r-metric-available region text" data-region="metric-available"><!-- Available label and value --><p style="line-height:1.05;margin:0">metric-available</p></div>
  <div class="r-metric-borrowed region text" data-region="metric-borrowed"><!-- Borrowed label and value --><p style="font-size:var(--r-metric-borrowed-font);line-height:1.05;margin:0">metric-borrowed</p></div>
  <div class="r-metric-missing region text" data-region="metric-missing"><!-- Missing label and value --><p style="font-size:var(--r-metric-missing-font);line-height:1.05;margin:0">metric-missing</p></div>
  <div class="r-metric-active region text" data-region="metric-active"><!-- Active Transactions label and value --><p style="font-size:var(--r-metric-active-font);line-height:1.05;margin:0">metric-active</p></div>
  <div class="r-metric-link region control" data-region="metric-link"><!-- View all action: rebuild the control's chrome from the crop (comp-spec.mjs --crop metric-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-inventory-heading region text" data-region="inventory-heading"><!-- Ready for Issue title and helper --><p style="font-size:var(--r-inventory-heading-font);line-height:1.05;margin:0">inventory-heading</p></div>
  <div class="r-inventory-list region control" data-region="inventory-list"><!-- category availability rows and progress tracks: rebuild the control's chrome from the crop (comp-spec.mjs --crop inventory-list); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-inventory-link region control" data-region="inventory-link"><!-- View all inventory action: rebuild the control's chrome from the crop (comp-spec.mjs --crop inventory-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-actions-heading region text" data-region="actions-heading"><!-- Counter Actions title and helper --><p style="font-size:var(--r-actions-heading-font);line-height:1.05;margin:0">actions-heading</p></div>
  <div class="r-borrow-action region control" data-region="borrow-action"><!-- primary Borrow Tools control with helper: rebuild the control's chrome from the crop (comp-spec.mjs --crop borrow-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-return-action region control" data-region="return-action"><!-- secondary Process Return control with helper: rebuild the control's chrome from the crop (comp-spec.mjs --crop return-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-mobile-scan-helper region control" data-region="mobile-scan-helper"><!-- mobile scanning helper panel: rebuild the control's chrome from the crop (comp-spec.mjs --crop mobile-scan-helper); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-custody-heading region text" data-region="custody-heading"><!-- Custody Now title and helper --><p style="font-size:var(--r-custody-heading-font);line-height:1.05;margin:0">custody-heading</p></div>
  <div class="r-custody-list region control" data-region="custody-list"><!-- active borrower ticket rows: rebuild the control's chrome from the crop (comp-spec.mjs --crop custody-list); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-custody-link region control" data-region="custody-link"><!-- View all active transactions action: rebuild the control's chrome from the crop (comp-spec.mjs --crop custody-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-surface-field region chrome" data-region="surface-field"><!-- flat warm-white instrument surface --></div>
  <div class="r-sidebar-field region chrome" data-region="sidebar-field"><!-- flat navy navigation rail --></div>
  <div class="r-warning-field region chrome" data-region="warning-field"><!-- flat yellow caution strip --></div>
</main>
</body>
</html>
