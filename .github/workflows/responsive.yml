name: Cross-browser responsive checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    if: vars.ENABLE_SEEDED_DEMO_CHECKS != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the seeded demo prerequisite
        run: |
          echo 'The shared demo accounts were retired during the client account reset.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This optional suite requires its designated seeded demo accounts. Enable ENABLE_SEEDED_DEMO_CHECKS only after those prerequisites are deliberately restored in the configured test environment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Client accounts require their own authenticators and must not be substituted into this password-only demo suite. The regular application CI remains enabled.' >> "$GITHUB_STEP_SUMMARY"
  responsive:
    if: vars.ENABLE_SEEDED_DEMO_CHECKS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check the live site without changing records
        run: node scripts/verify-responsive.mjs https://labtrack-qr.vercel.app ${{ matrix.browser }} production
        env:
          DEMO_ACCOUNT_PASSWORD: ${{ secrets.DEMO_ACCOUNT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-${{ matrix.browser }}
          path: output/responsive-qa/
          retention-days: 3
